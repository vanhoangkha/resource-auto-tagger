AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Auto-tag EC2 instances and EBS volumes based on IAM identity

Metadata:
  AWS::ServerlessRepo::Application:
    Name: resource-auto-tagger
    Description: Automatically tag EC2 instances based on IAM identity
    Author: AWS
    SpdxLicenseId: MIT-0
    Labels: ['ec2', 'tagging', 'automation', 'governance']

Parameters:
  AlertEmail:
    Type: String
    Description: Email for error alerts (optional)
    Default: ''
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 128
    Tracing: Active
    Architectures:
      - arm64

Resources:
  AutoTaggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: resource-auto-tagger
      Handler: resource-auto-tagger.lambda_handler
      CodeUri: source/
      Description: Auto-tags EC2 instances and EBS volumes based on IAM identity
      ReservedConcurrentExecutions: 10
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt DLQ.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          POWERTOOLS_SERVICE_NAME: resource-auto-tagger
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: EC2Describe
              Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:DescribeVolumes
              Resource: '*'
            - Sid: EC2CreateTags
              Effect: Allow
              Action: ec2:CreateTags
              Resource:
                - !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                - !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
            - Sid: IAMReadTags
              Effect: Allow
              Action:
                - iam:ListRoleTags
                - iam:ListUserTags
              Resource:
                - !Sub arn:aws:iam::${AWS::AccountId}:role/*
                - !Sub arn:aws:iam::${AWS::AccountId}:user/*
            - Sid: SSMRead
              Effect: Allow
              Action: ssm:GetParametersByPath
              Resource: !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/auto-tag/*
      Events:
        EC2RunInstances:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.ec2
              detail-type:
                - AWS API Call via CloudTrail
              detail:
                eventSource:
                  - ec2.amazonaws.com
                eventName:
                  - RunInstances

  DLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: resource-auto-tagger-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AutoTaggerFunction}
      RetentionInDays: 30

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: resource-auto-tagger-errors
      AlarmDescription: Triggers when Lambda function has errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AutoTaggerFunction
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], []]
      TreatMissingData: notBreaching

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: resource-auto-tagger-alerts
      KmsMasterKeyId: alias/aws/sns
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

Outputs:
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AutoTaggerFunction.Arn
  FunctionName:
    Description: Lambda function name
    Value: !Ref AutoTaggerFunction
  DLQUrl:
    Description: Dead letter queue URL
    Value: !Ref DLQ
  DLQArn:
    Description: Dead letter queue ARN
    Value: !GetAtt DLQ.Arn
